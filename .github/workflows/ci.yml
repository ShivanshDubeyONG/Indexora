name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,benchmark,api]"

    - name: Run git diff check
      run: |
        git diff --check

    - name: Run tests
      run: |
        pytest

    - name: Run offline smoke benchmark
      run: |
        python -m indexora.benchmark --smoke --output-dir ci_benchmark_output

    - name: Verify benchmark artifacts
      run: |
        test -f ci_benchmark_output/benchmark_results.json
        test -f ci_benchmark_summary.csv || test -f ci_benchmark_output/benchmark_summary.csv
        test -f ci_benchmark_output/recall_vs_latency.png
        test -f ci_benchmark_output/recall_vs_distance_computations.png
