[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "indexora"
version = "0.1.0.dev0"
description = "A learning-first vector search engine built from scratch in Python and NumPy."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Indexora Contributors" }
]
dependencies = [
    "numpy>=1.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "matplotlib>=3.5.0",
]
benchmark = [
    "matplotlib>=3.5.0",
]
adapters = [
    "faiss-cpu>=1.7.4",
    "hnswlib>=0.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
