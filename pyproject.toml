[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "indexora"
version = "1.0.0"
description = "A learning-first vector search engine built from scratch in Python and NumPy."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Shivansh Dubey", email = "shivansh1.mitblr2024@learner.manipal.edu" },
    { name = "Indexora Contributors" }
]
dependencies = [
    "numpy>=1.23.0",
]

[project.urls]
Homepage = "https://github.com/ShivanshDubeyONG/Indexora"
Repository = "https://github.com/ShivanshDubeyONG/Indexora"
"Bug Tracker" = "https://github.com/ShivanshDubeyONG/Indexora/issues"
Documentation = "https://github.com/ShivanshDubeyONG/Indexora#readme"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "matplotlib>=3.5.0",
]
benchmark = [
    "matplotlib>=3.5.0",
]
adapters = [
    "faiss-cpu>=1.7.4",
    "hnswlib>=0.7.0",
]
ui = [
    "streamlit>=1.30.0",
    "matplotlib>=3.5.0",
]
semantic = [
    "sentence-transformers>=2.2.0",
    "torch>=1.11.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: opt-in tests requiring external models or network access",
]
addopts = "-m 'not integration'"
